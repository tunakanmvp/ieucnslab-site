- id: bap-2026-altyapi
  funder_tr: "İzmir Ekonomi Üniversitesi Bilimsel Araştırma Projeleri Koordinasyon Birimi"
  funder_en: "İzmir University of Economics, Scientific Research Projects Coordination Unit"
  program_tr: "BAP"
  program_en: "BAP"
  number: ""
  title_tr: "Çok Kipli Psikofizyolojik Araştırma Altyapısı"
  title_en: "Multimodal Psychophysiological Research Infrastructure"
  years: "2026–"
  pi: "Prof. Dr. Aydın Akan"
  team: ""
  status: "ongoing"
  summary_tr: "EEG, deri iletkenliği (GSR), göz takibi ve yüz ifadesi verilerini anketlerle birlikte, eşzamanlı olarak toplayıp analiz edebilen ortak bir araştırma altyapısı kurmayı amaçlayan proje. Altyapı; duygu, dikkat, güven ve karar verme gibi süreçlerin müzik, koku ve tat algısı, nöropazarlama ve tüketici davranışı gibi farklı alanlarda incelenmesine ve lisansüstü tez çalışmalarına hizmet edecek. Proje, İEÜ BAP Komisyonu tarafından 2026'da desteklenmeye uygun bulundu."
  summary_en: "A project to build a shared research infrastructure that records and analyses EEG, skin conductance (GSR), eye tracking and facial expression data simultaneously, together with questionnaires. The infrastructure will support the study of emotion, attention, trust and decision-making across areas such as music, smell and taste perception, neuromarketing and consumer behaviour, as well as graduate theses. The project was approved for funding by the IEU BAP Commission in 2026."

