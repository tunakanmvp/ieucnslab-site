  summary_tr: "Koku uyaranlarına verilen EEG tepkilerinin nöropazarlama amacıyla incelenmesi başta olmak üzere, EEG sinyallerinin makine öğrenmesi ve derin öğrenme yöntemleriyle analiz edildiği çalışmalarımızı destekleyen proje. Koku ve tüketici duyguları, tat algısı ve ürün maskotları üzerine çalışmaların yanı sıra DEHB ve Alzheimer demansının EEG ile tespitine yönelik çalışmalar da bu proje kapsamında kısmen desteklendi."
  summary_en: "A project supporting our work on analysing EEG signals with machine learning and deep learning, above all the study of EEG responses to olfactory stimuli for neuromarketing. Alongside studies on scent and consumer emotion, taste perception and product mascots, work on detecting ADHD and Alzheimer's dementia from EEG was also partially supported under this project."
