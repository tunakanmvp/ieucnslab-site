- name: Berkay İlber Tunakan
  match: "Tunakan"
  group: researchers
  role_tr: Araştırma Görevlisi, Yüksek Lisans Öğrencisi
  role_en: Research Assistant, MSc Student
  bio_tr: "2024 yılında Elektrik-Elektronik Mühendisliği Bölümünden mezun oldu. Bitirme projesinde uçak gürültüsünün dikkat üzerindeki etkisini EEG ile inceledi. Yüksek lisans tezinde marka güveni algısının sinirsel bağıntılarını araştırıyor. Laboratuvarda deney tasarımı, veri toplama ve analiz süreçlerinde görev alıyor ve Python ile deney ortamları ve görev arayüzleri geliştiriyor. Tat uyaranlarına verilen duygusal tepkilerin EEG ile analizi (CoDIT 2026) ve karar destekli akıllı infüzyon pompası tasarımı (TIPTEKNO 2025) üzerine bildirilerde ortak yazardır."
  bio_en: "He graduated in Electrical and Electronics Engineering in 2024. In his capstone project, he used EEG to study how aircraft noise affects attention. His master’s thesis investigates the neural correlates of perceived brand trust. At the lab, he contributes to experimental design, data collection and analysis, and builds experimental environments and task interfaces in Python. He co-authored conference papers on EEG analysis of emotional responses to taste stimuli (CoDIT 2026) and the design of a smart infusion pump with decision support (TIPTEKNO 2025)."
