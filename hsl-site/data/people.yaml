- name: Uğur Emin Baynal
  match: "Baynal"
  group: researchers
  role_tr: Yüksek Lisans Öğrencisi
  role_en: MSc Student
  bio_tr: "İzmir Ekonomi Üniversitesi Bilgisayar Mühendisliği ve Elektrik-Elektronik Mühendisliği çift anadal programlarından mezun oldu. Lisans eğitimi sırasında IEEE Öğrenci Kolu yönetiminde görev aldı ve üniversite bünyesinde elektrikli araç, otonom sistemler ve rover geliştirme projelerinde çalıştı.

Araştırmalarını nöromühendislik, biyomedikal cihaz tasarımı, gömülü sistemler ve yapay zekâ uygulamaları üzerine sürdürmektedir. Yüksek lisans tezi kapsamında, geleneksel alın bölgesi odaklı ölçümlerin ötesine geçerek kafa derisinin farklı bölgelerinden veri toplayabilen, genişletilmiş uzamsal kapsama sahip bir fonksiyonel yakın kızılötesi spektroskopi (fNIRS) sistemi geliştirmektedir. Çalışmasında donanım ve yazılım entegrasyonu ile gömülü yapay zekâ yöntemlerinin nörofizyolojik veri işleme süreçlerinde kullanılmasına odaklanmaktadır."
  bio_en: "He graduated from Izmir University of Economics with a double major in Computer Engineering and Electrical and Electronics Engineering. During his undergraduate studies, he served on the board of the IEEE Student Branch and contributed to electric vehicle development, autonomous systems, and rover projects.

His research focuses on neuroengineering, biomedical device development, embedded systems, and artificial intelligence. As part of his master's thesis, he is developing a functional near-infrared spectroscopy (fNIRS) system designed to extend spatial recording coverage beyond the conventional forehead-focused approach, enabling measurements across multiple regions of the scalp. His work involves hardware–software integration and the application of embedded artificial intelligence techniques to neurophysiological signal processing."
