- name: Burak Akbuğday
  match: "Burak Akbu[gğ]day"
  group: researchers
  role_tr: "Araştırma Görevlisi"
  role_en: "Research Assistant"
  bio_tr: "EEG sinyallerinin makine ve derin öğrenme yöntemleriyle analizi üzerine çalışmaktadır."
  bio_en: "EEG signal analysis with machine and deep learning methods."
  biography_tr: "Çalışmaları, EEG sinyallerinin makine öğrenmesi ve derin öğrenme yöntemleriyle analizi üzerinde yoğunlaşmaktadır. Nöropazarlama uygulamalarına yönelik olarak koku uyaranlarının EEG'den tespiti ve koku karşısında oluşan duygusal tepkilerin sınıflandırılması üzerine bir dizi çalışmada yer almıştır. EEG öznitelik haritaları ve derin öğrenme kullanılarak dikkat eksikliği ve hiperaktivite bozukluğu (DEHB) ile Alzheimer demansının tespiti, çevre koşulları ve gürültünün dikkat ve zihinsel görevler üzerindeki etkisi, sınıf ortamında anlık duygu durumunun belirlenmesi ve sürdürülebilir ürün ambalajının tüketici davranışına etkisi de çalıştığı konular arasındadır."
  biography_en: "His work focuses on analysing EEG signals with machine learning and deep learning methods. He has contributed to a series of studies on detecting olfactory stimuli from EEG and classifying emotional responses to odours for neuromarketing applications. His other topics include detecting attention deficit hyperactivity disorder (ADHD) and Alzheimer's dementia using EEG feature maps and deep learning, the effect of environmental conditions and noise on attention and mental tasks, real-time mood detection in the classroom, and the effect of sustainable product packaging on consumer behaviour."
