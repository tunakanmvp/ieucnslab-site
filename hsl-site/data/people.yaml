  bio_tr: "İzmir Ekonomi Üniversitesi Mekatronik Mühendisliği ve Elektrik-Elektronik Mühendisliği çift anadal programlarından mezun oldu. Laboratuvarımız bünyesinde tat algısına yönelik nörofizyolojik tepkilerin EEG sinyalleri üzerinden makine öğrenmesi yöntemleriyle değerlendirilmesi üzerine çalışmalar yürüttü.

Araştırmalarını bilişsel sinirbilim, duygusal bilgi işleme ve biyomedikal sinyal analizi alanlarında sürdürmektedir. Yüksek lisans tezi kapsamında, Türk müziğindeki farklı makamların uyandırdığı algılanan ve hissedilen duyguların ayrıştırılmasını EEG sinyalleri, makine öğrenmesi ve derin öğrenme yöntemleriyle araştırmaktadır."
  bio_en: "She graduated from Izmir University of Economics with a double major in Mechatronics Engineering and Electrical and Electronics Engineering. At the Computational Neuroscience Laboratory, she has conducted research on the evaluation of neurophysiological responses to taste stimuli using EEG signals and machine learning techniques.

Her research focuses on cognitive neuroscience, affective computing, and biomedical signal processing. As part of her master's thesis, she investigates the differentiation between perceived and felt emotions elicited by different makams (modal structures) in Turkish music, employing EEG-based analysis, machine learning, and deep learning methods."
