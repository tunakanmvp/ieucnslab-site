- name: Berkay İlber Tunakan
  match: "Tunakan"
  group: researchers
  role_tr: Araştırma Görevlisi, Yüksek Lisans Öğrencisi
  role_en: Research Assistant, MSc Student
  bio_tr: "2024 yılında İzmir Ekonomi Üniversitesi Elektrik-Elektronik Mühendisliği Bölümünden mezun oldu. Lisans bitirme projesinde uçak gürültüsünün dikkat ve bilişsel performans üzerindeki etkilerini elektroensefalografi (EEG) kullanarak inceledi. Yüksek lisans çalışmalarını, marka güveni algısının sinirsel bağıntılarının EEG sinyalleri üzerinden araştırılması üzerine sürdürmektedir.

Computational Neuroscience Laboratory bünyesinde bilişsel sinirbilim, nöromühendislik ve biyomedikal sinyal işleme alanlarında çalışmalar yürütmektedir. EEG tabanlı deneylerin tasarlanması ve uygulanması, elektrofizyolojik verilerin toplanması, ön işlenmesi ve analizi süreçlerinde görev almaktadır. Araştırmalarında EEG sinyallerinden öznitelik çıkarımı, makine öğrenmesi ve derin öğrenme yöntemleriyle bilişsel ve duygusal süreçlerin modellenmesine odaklanmaktadır. Ayrıca Python kullanarak deneysel paradigmalar, uyaran sunum sistemleri ve davranışsal veri toplama arayüzleri geliştirmektedir."
  bio_en: "He graduated from Izmir University of Economics with a degree in Electrical and Electronics Engineering in 2024. In his undergraduate capstone project, he investigated the effects of aircraft noise on attention and cognitive performance using electroencephalography (EEG). His master's research focuses on investigating the neural correlates of perceived brand trust through EEG-based analysis.

At the Computational Neuroscience Laboratory, he conducts research in cognitive neuroscience, neuroengineering, and biomedical signal processing. He contributes to the design and implementation of EEG-based experiments, electrophysiological data acquisition, signal preprocessing, and analysis. His research focuses on feature extraction from EEG signals and the application of machine learning and deep learning techniques to model cognitive and affective processes. Additionally, he develops experimental paradigms, stimulus presentation systems, and behavioral data acquisition interfaces using Python."
